board: Dobermann S3
name: Dobermann Example

stepping:
  engine: I2S_STream
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 4
  disable_delay_us: 0
  segments: 6

i2so:
  bck_pin: gpio.16
  data_pin: gpio.17
  ws_pin: gpio.18


axes:
  x:
    steps_per_mm: 320.000
    max_rate_mm_per_min: 3000.0
    acceleration_mm_per_sec2: 150.0
    max_travel_mm: 1220.000
    soft_limits: true
    homing:
      cycle: 2                    # X and Y home together on cycle 2
      positive_direction: true    # Switch is on the RIGHT (facing the front). +X = right, so
      mpos_mm: 0.000              # X0 is at the right switch and the table is X0 to -1220.
      feed_mm_per_min: 200.0
      seek_mm_per_min: 1500.0
      settle_ms: 250
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.42:low # First pin on the left (right-hand switch = +X end)
      hard_limits: true
      standard_stepper:
        step_pin: i2so.0          # Driver Slot 1
        direction_pin: i2so.1      # was :low before X was flipped 2026-10-19
        disable_pin: i2so.2

  y:
    steps_per_mm: 320.000
    max_rate_mm_per_min: 3000.0
    acceleration_mm_per_sec2: 150.0
    max_travel_mm: 1200.000
    soft_limits: true
    homing:
      cycle: 2                    # Two motors with individual limits: auto-squaring on homing
      positive_direction: true    # Switches are at the BACK. +Y = toward the back (standard CAM
      mpos_mm: 0.000              # convention), so Y0 is at the back and the table is Y0 to -1200.
      feed_mm_per_min: 200.0
      seek_mm_per_min: 1500.0
      settle_ms: 250

    # Y1 Motor (Driver Slot 2)
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.41:low # Second pin from the left (back switch = +Y end)
      hard_limits: true
      standard_stepper:
        step_pin: i2so.3          # Driver Slot 2
        direction_pin: i2so.4      # was :low before Y was flipped 2026-10-19
        disable_pin: i2so.5

    # Y2 Motor (Driver Slot 3)
    motor1:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.40:low # Third pin from the left (back switch = +Y end)
      hard_limits: true
      standard_stepper:
        step_pin: i2so.6          # Driver Slot 3
        direction_pin: i2so.7      # was :low before Y was flipped 2026-10-19
        disable_pin: i2so.8

  z:
    steps_per_mm: 320.000
    max_rate_mm_per_min: 2500.0   # Must stay above the F2000 engagement feed in tc.nc
    acceleration_mm_per_sec2: 100.0
    max_travel_mm: 115.000        # -118 = carriage flush with rail end; 3mm buffer.
    soft_limits: true
                                  # tc.nc reaches -105, so only 10mm spare
    homing:
      cycle: 1                    # Z homes FIRST on cycle 1 to avoid crashing bits
      positive_direction: true
      mpos_mm: 0.000
      feed_mm_per_min: 100.0
      seek_mm_per_min: 400.0
      settle_ms: 250
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.39:low # Fourth pin from the left (homes up/positive)
      hard_limits: true
      standard_stepper:
        step_pin: i2so.9          # Driver Slot 4
        direction_pin: i2so.10
        disable_pin: i2so.11


10V:
  forward_pin: gpio.7
  reverse_pin: gpio.8
  pwm_hz: 5000
  output_pin: gpio.6
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.000% 24000=100.000%
  off_on_alarm: true            # stop the spindle on any alarm (a false X-limit trip at 18000 rpm left it running)
  m6_macro: $LocalFS/Run=tc.nc   # macros live in internal flash, not on the SD card

# --- RapidChange ATC (Premium, 6 pockets) ---
# Wiring: green = GPIO 36 (tool setter), yellow = GPIO 38 (IR beam).
# Dust cover is NOT controlled from here -- no user_outputs section, and the
# M64 P1 / M65 P1 lines are stripped out of tc.nc to match. The cover must be
# removed or secured open, because tc.nc drives Z to -105 into the magazine.
probe:
  pin: gpio.36:low             # Green wire: tool setter
  check_mode_start: true

user_inputs:
  digital0_pin: gpio.38:low    # Yellow wire: IR beam (M66 P0 in the macros)

macros:
  macro0: $LocalFS/Run=measuretool.nc
  macro1: $LocalFS/Run=findzposition.nc
  macro2: $LocalFS/Run=dustshoe_unload.nc   # park dust shoe in its stand
  macro3: $LocalFS/Run=dustshoe_load.nc     # pick dust shoe up from its stand

# --- Driver alarms ---
# ALM rests open and pulls low on alarm: measured 2026-10-24 on the Z driver,
# 0 healthy and 1 with the driver alarmed, so the four are wired in parallel.
# All ALM to gpio.37 signal, all COM- to that connector's GND.
#
# The opto-isolated input block is ten pins: 42 41 40 39 38 37 36 48 47 3.
# Used: 42/41/40/39 limits, 38 IR beam, 36 probe, 37 driver alarms.
# Free: 48, 47, 3 - gpio.3 last, it is an ESP32-S3 strapping pin.
# estop_pin can have 47 or 48 when a spare contact is fitted.
control:
  fault_pin: gpio.37:low

spi:
  miso_pin: gpio.2
  mosi_pin: gpio.1
  sck_pin: gpio.21

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.9


start:
  must_home: true
  deactivate_parking: false
  check_limits: true
